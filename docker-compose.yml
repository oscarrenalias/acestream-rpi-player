name: acestream

services:
  # Registers qemu-x86_64 with the host kernel's binfmt_misc subsystem.
  # Runs once and exits successfully.
  binfmt:
    image: tonistiigi/binfmt:latest
    platform: linux/arm64
    container_name: acestream-binfmt
    privileged: true
    command:
      - --install
      - amd64
    restart: "no"

  acestream:
    image: ghcr.io/martinbjeldbak/acestream-http-proxy:latest
    platform: linux/amd64
    container_name: acestream

    depends_on:
      binfmt:
        condition: service_completed_successfully

    environment:
      ALLOW_REMOTE_ACCESS: "yes"

    restart: unless-stopped

    stop_grace_period: 20s

  catalog:
    image: ghcr.io/oscarrenalias/acestream-rpi-player-catalog:latest
    container_name: acestream-catalog

    volumes:
      - acestream-catalog:/data
      - ./catalog/config.yaml:/app/catalog/config.yaml:ro

    restart: unless-stopped

  player:
    image: ghcr.io/oscarrenalias/acestream-rpi-player:latest
    container_name: acestream-player

    depends_on:
      acestream:
        condition: service_started
      catalog:
        condition: service_started

    ports:
      - "8080:80"

    restart: unless-stopped

volumes:
  acestream-catalog:
