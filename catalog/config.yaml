# Verify TLS certificates when retrieving event-detail pages. The current
# LiveTV event host presents an incomplete/untrusted certificate chain, so this
# is disabled explicitly for that source. Keep this enabled for trusted hosts.
event_requests:
  verify_tls: false

# A discovery refresh only downloads and filters the RSS feed. A stream refresh
# fetches detail pages only for events in the active/upcoming time window.
refresh:
  discovery_interval_seconds: 3600
  stream_interval_seconds: 300
  stream_lookback_hours: 2
  stream_window_hours: 24
  retention_hours: 12

# URLs emitted in playlist.m3u. {base_url} is the public URL used to request
# the playlist (normally the nginx player on port 8080), while {content_id} is
# replaced for every playlist entry.
playlist:
  stream_url_template: "{base_url}/ace/getstream?id={content_id}"
