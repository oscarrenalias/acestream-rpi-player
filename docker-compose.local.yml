# Development-only override. It builds changed services from this checkout
# instead of pulling their published images. Keep docker-compose.yml unchanged
# for production/systemd use.
services:
  catalog:
    image: acestream-catalog:local
    build:
      context: .
      dockerfile: catalog/Dockerfile
    pull_policy: build

  player:
    image: acestream-player:local
    build:
      context: ./player
      dockerfile: Dockerfile
    pull_policy: build
