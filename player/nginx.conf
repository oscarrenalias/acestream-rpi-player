server {
    listen 80;
    server_name _;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Keep the player and HLS stream on the same browser origin. The lack of a
    # trailing slash on proxy_pass preserves the complete /ace/... URI.
    location /ace/ {
        proxy_pass http://acestream:6878;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AceStream emits absolute redirects using an internal address (for
        # example http://127.0.0.1:8080/ace/r/...). Turn every upstream HTTP
        # redirect into a root-relative one so the client retains the public
        # player host, port, and scheme.
        proxy_redirect ~^http://[^/]+(/.*)$ $1;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # MPEG-TS requests are redirected by the engine from /ace/getstream to
    # /content/...; this must use the same upstream rather than falling through
    # to the static player application.
    location /content/ {
        proxy_pass http://acestream:6878;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect ~^http://[^/]+(/.*)$ $1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # The catalog stays internal to Compose. Expose its M3U playlist and API
    # through this same public origin so clients only need port 8080.
    location = /playlist.m3u {
        proxy_pass http://catalog:8090/playlist.m3u;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /catalog/ {
        proxy_pass http://catalog:8090/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
