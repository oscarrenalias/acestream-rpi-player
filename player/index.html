<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AceStream Player</title>
  <link rel="stylesheet" href="/vendor/video.js/video-js.min.css">
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body { margin: 0; background: #08090b; color: #f4f6f8; overflow: hidden; }
    main { width: 100%; height: 100%; display: grid; place-items: center; }
    .stream-picker { width: min(100% - 2rem, 760px); }
    .hint { margin: 0 0 .75rem; color: #aeb7c2; }
    form { display: flex; gap: .75rem; }
    input { flex: 1; min-width: 0; padding: .8rem; border: 1px solid #46505d;
      border-radius: .4rem; background: #191d23; color: inherit; font: inherit; }
    button { padding: .8rem 1.4rem; border: 0; border-radius: .4rem;
      background: #2f7df4; color: white; font: inherit; font-weight: 650; cursor: pointer; }
    #cancel-change { display: none; background: #46505d; }
    .picker-actions { display: flex; gap: .75rem; }
    input:focus, button:focus { outline: 3px solid #8bb8ff; outline-offset: 2px; }
    .video-js { display: none; width: 100%; height: 100%; }
    #status { min-height: 1.5em; color: #f2c66d; }
    body.has-stream main { display: block; }
    body.has-stream .video-js { display: block; }
    body.has-stream .stream-picker { display: none; }
    body.choosing-stream .stream-picker { display: block; position: fixed; z-index: 11;
      top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 1rem;
      border-radius: .6rem; background: rgb(16 18 22 / 92%); box-shadow: 0 1rem 4rem #000; }
    body.has-stream.choosing-stream #cancel-change { display: block; }
    .video-js .vjs-change-stream-control { width: auto; padding: 0 1em; }
    .video-js .vjs-change-stream-control .vjs-icon-placeholder { display: none; }
    .video-js .vjs-change-stream-control::after { content: 'Change stream'; white-space: nowrap; }
    .video-js .vjs-event-list-control { width: auto; padding: 0 1em; }
    .video-js .vjs-event-list-control .vjs-icon-placeholder { display: none; }
    .video-js .vjs-event-list-control::after { content: 'Event list'; white-space: nowrap; }
    #event-list { position: fixed; z-index: 20; inset: 0; display: grid; place-items: center;
      padding: 1rem; background: rgb(0 0 0 / 66%); }
    #event-list[hidden] { display: none; }
    .event-dialog { width: min(100%, 760px); max-height: min(80vh, 720px); display: flex;
      flex-direction: column; border: 1px solid #46505d; border-radius: .6rem;
      background: #101216; box-shadow: 0 1rem 4rem #000; }
    .event-dialog-header { display: flex; align-items: center; justify-content: space-between;
      gap: 1rem; padding: 1rem 1rem .75rem; }
    .event-dialog-header h2 { margin: 0; font-size: 1.1rem; }
    .event-dialog-header button { padding: .45rem .75rem; background: #46505d; }
    .event-filters { padding: 0 1rem .75rem; }
    select { width: 100%; padding: .65rem; border: 1px solid #46505d; border-radius: .4rem;
      background: #191d23; color: inherit; font: inherit; }
    #event-list-status { min-height: 1.5em; margin: 0; padding: 0 1rem .75rem; color: #aeb7c2; }
    #event-list-content { overflow-y: auto; padding: 0 1rem 1rem; }
    .event-item { padding: .85rem 0; border-top: 1px solid #2c333d; }
    .event-title { margin: 0 0 .25rem; font-weight: 650; }
    .event-meta { margin: 0 0 .6rem; color: #aeb7c2; font-size: .9rem; }
    .event-streams { display: flex; flex-wrap: wrap; gap: .5rem; }
    .event-stream { display: flex; flex-wrap: wrap; align-items: center; gap: .3rem; }
    .event-stream button { padding: .45rem .75rem; }
    .event-stream .copy-vlc-link { padding: .3rem .45rem; background: #303844;
      font-size: .78rem; font-weight: 550; }
    #stream-loading { position: fixed; z-index: 30; inset: 0; display: grid; place-items: center;
      background: rgb(0 0 0 / 58%); }
    #stream-loading[hidden] { display: none; }
    .loading-message { display: flex; align-items: center; gap: .8rem; padding: 1rem 1.25rem;
      border-radius: .6rem; background: #101216; box-shadow: 0 1rem 4rem #000; font-weight: 650; }
    .spinner { width: 1.35rem; height: 1.35rem; border: 3px solid #6d7887;
      border-top-color: #8bb8ff; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .mobile-player-actions { display: none; }
    @media (max-width: 700px), (pointer: coarse) {
      form, .picker-actions { flex-direction: column; }
      body.has-stream .mobile-player-actions { position: fixed; z-index: 10; top: max(.75rem, env(safe-area-inset-top));
        left: .75rem; right: .75rem; display: flex; justify-content: flex-end; gap: .5rem; }
      .mobile-player-actions button { padding: .5rem .7rem; background: rgb(16 18 22 / 90%);
        border: 1px solid #46505d; font-size: .85rem; }
    }
  </style>
</head>
<body>
  <main>
    <section class="stream-picker">
      <p class="hint">Choose an available event, or paste a content ID, an acestream:// link, or an AceStream HTTP URL.</p>
      <form id="stream-form">
        <input id="stream-input" aria-label="AceStream content ID or URL"
          placeholder="acestream://…" autocomplete="off" spellcheck="false" required>
        <div class="picker-actions">
          <button type="submit">Play</button>
          <button id="show-events" type="button">Event list</button>
          <button id="cancel-change" type="button">Cancel</button>
        </div>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
    </section>

    <video id="video" class="video-js vjs-default-skin vjs-big-play-centered"
      controls playsinline preload="auto"></video>
  </main>

  <nav class="mobile-player-actions" aria-label="Player actions">
    <button id="mobile-events" type="button">Event list</button>
    <button id="mobile-change-stream" type="button">Change</button>
    <button id="mobile-fullscreen" type="button">Fullscreen</button>
  </nav>

  <section id="event-list" hidden aria-labelledby="event-list-title">
    <div class="event-dialog" role="dialog" aria-modal="true">
      <header class="event-dialog-header">
        <h2 id="event-list-title">Available streams</h2>
        <button id="close-events" type="button" aria-label="Close event list">Close</button>
      </header>
      <div class="event-filters">
        <label for="event-category">Category</label>
        <select id="event-category"><option value="">All categories</option></select>
      </div>
      <p id="event-list-status" role="status" aria-live="polite"></p>
      <div id="event-list-content"></div>
    </div>
  </section>

  <div id="stream-loading" hidden role="status" aria-live="polite">
    <div class="loading-message"><span class="spinner" aria-hidden="true"></span>Loading stream…</div>
  </div>

  <script src="/vendor/video.js/video.min.js"></script>
  <script>
    const form = document.querySelector('#stream-form');
    const input = document.querySelector('#stream-input');
    const status = document.querySelector('#status');
    const cancelChange = document.querySelector('#cancel-change');
    const showEvents = document.querySelector('#show-events');
    const eventList = document.querySelector('#event-list');
    const closeEvents = document.querySelector('#close-events');
    const eventCategory = document.querySelector('#event-category');
    const eventListStatus = document.querySelector('#event-list-status');
    const eventListContent = document.querySelector('#event-list-content');
    const streamLoading = document.querySelector('#stream-loading');
    const mobileEvents = document.querySelector('#mobile-events');
    const mobileChangeStream = document.querySelector('#mobile-change-stream');
    const mobileFullscreen = document.querySelector('#mobile-fullscreen');
    const player = videojs('video', { fill: true, liveui: true });
    let events = [];
    let eventRefreshTimer;

    const Button = videojs.getComponent('Button');
    class ChangeStreamButton extends Button {
      constructor(player, options) {
        super(player, options);
        this.controlText('Change stream');
        this.addClass('vjs-change-stream-control');
      }

      handleClick() {
        chooseStream();
      }
    }
    videojs.registerComponent('ChangeStreamButton', ChangeStreamButton);
    player.getChild('controlBar').addChild('ChangeStreamButton', {}, 12);

    class EventListButton extends Button {
      constructor(player, options) {
        super(player, options);
        this.controlText('Event list');
        this.addClass('vjs-event-list-control');
      }

      handleClick() { openEventList(); }
    }
    videojs.registerComponent('EventListButton', EventListButton);
    player.getChild('controlBar').addChild('EventListButton', {}, 12);

    function contentId(value) {
      const text = value.trim();
      const direct = text.match(/^[a-f\d]{40}$/i);
      if (direct) return direct[0];

      const aceLink = text.match(/^acestream:\/\/([a-f\d]{40})(?:[/?#]|$)/i);
      if (aceLink) return aceLink[1];

      try {
        const id = new URL(text).searchParams.get('id');
        if (id && /^[a-f\d]{40}$/i.test(id)) return id;
      } catch (_) {}

      throw new Error('Enter a 40-character AceStream content ID or a URL containing one.');
    }

    function playbackPid() {
      if (window.crypto?.randomUUID) return window.crypto.randomUUID();
      const bytes = new Uint8Array(16);
      if (window.crypto?.getRandomValues) {
        window.crypto.getRandomValues(bytes);
        return Array.from(bytes, (byte) => byte.toString(16).padStart(2, '0')).join('');
      }
      return `${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;
    }

    function streamUrl(path, id) {
      const url = new URL(path, window.location.origin);
      url.searchParams.set('id', id);
      url.searchParams.set('pid', playbackPid());
      return url.pathname + url.search;
    }

    async function playContentId(id) {
      status.textContent = 'Connecting to stream…';
      streamLoading.hidden = false;
      try {
        player.src({
          src: streamUrl('/ace/manifest.m3u8', id),
          type: 'application/x-mpegURL'
        });
        await player.play();
        document.body.classList.add('has-stream');
        document.body.classList.remove('choosing-stream');
        closeEventList();
      } catch (error) {
        streamLoading.hidden = true;
        throw error;
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      try { await playContentId(contentId(input.value)); }
      catch (error) { status.textContent = error.message || 'Unable to start playback.'; }
    });

    function eventDate(value) {
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? '' : new Intl.DateTimeFormat(undefined, {
        weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
      }).format(date);
    }

    function vlcLink(id) {
      return new URL(streamUrl('/ace/getstream', id), window.location.origin).href;
    }

    async function copyVlcLink(id) {
      const link = vlcLink(id);
      try {
        if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(link);
        } else {
          const clipboardFallback = document.createElement('textarea');
          clipboardFallback.value = link;
          clipboardFallback.setAttribute('readonly', '');
          clipboardFallback.style.cssText = 'position:fixed; opacity:0;';
          document.body.append(clipboardFallback);
          clipboardFallback.select();
          const copied = document.execCommand('copy');
          clipboardFallback.remove();
          if (!copied) throw new Error('Copy was not permitted.');
        }
        eventListStatus.textContent = 'VLC link copied to the clipboard.';
      } catch (error) {
        window.prompt('Copy this VLC link:', link);
        eventListStatus.textContent = 'Select and copy the VLC link shown in the prompt.';
      }
    }

    function eventStreams(event) {
      if (Array.isArray(event.streams)) return event.streams;
      return (event.content_ids || []).map((contentId) => ({ content_id: contentId, metadata: '' }));
    }

    function renderEvents() {
      const selectedCategory = eventCategory.value;
      eventListContent.replaceChildren();
      const playableEvents = events.filter((event) =>
        (!selectedCategory || event.category === selectedCategory) && eventStreams(event).length);
      if (!playableEvents.length) {
        eventListStatus.textContent = events.length ? 'No available streams in this category.' : 'No streams are available yet.';
        return;
      }
      eventListStatus.textContent = `${playableEvents.length} event${playableEvents.length === 1 ? '' : 's'} available`;
      for (const event of playableEvents) {
        const item = document.createElement('article');
        item.className = 'event-item';
        const title = document.createElement('p');
        title.className = 'event-title';
        title.textContent = `[${event.category}] ${event.title}`;
        const meta = document.createElement('p');
        meta.className = 'event-meta';
        meta.textContent = [event.description, eventDate(event.starts_at)].filter(Boolean).join(' — ');
        const streams = document.createElement('div');
        streams.className = 'event-streams';
        const eventStreamList = eventStreams(event);
        eventStreamList.forEach((eventStream, index) => {
          const id = eventStream.content_id;
          const streamMetadata = eventStream.metadata?.trim();
          const stream = document.createElement('div');
          stream.className = 'event-stream';
          const playButton = document.createElement('button');
          playButton.type = 'button';
          playButton.textContent = streamMetadata
            ? `Play ${streamMetadata}`
            : eventStreamList.length === 1 ? 'Play' : `Play stream ${index + 1}`;
          playButton.addEventListener('click', async () => {
            try { await playContentId(id); }
            catch (error) { eventListStatus.textContent = error.message || 'Unable to start playback.'; }
          });
          const copyButton = document.createElement('button');
          copyButton.type = 'button';
          copyButton.className = 'copy-vlc-link';
          copyButton.textContent = 'VLC';
          copyButton.title = 'Copy VLC link';
          copyButton.setAttribute('aria-label', 'Copy VLC link');
          copyButton.addEventListener('click', () => copyVlcLink(id));
          stream.append(playButton, copyButton);
          streams.append(stream);
        });
        item.append(title, meta, streams);
        eventListContent.append(item);
      }
    }

    async function loadEvents() {
      eventListStatus.textContent = events.length ? 'Refreshing streams…' : 'Loading streams…';
      try {
        const response = await fetch('/catalog/api/events', { cache: 'no-store' });
        if (!response.ok) throw new Error(`Catalog request failed (${response.status}).`);
        const data = await response.json();
        events = Array.isArray(data) ? data : data.events || [];
        const categories = [...new Set(events
          .filter((event) => eventStreams(event).length)
          .map((event) => event.category)
          .filter(Boolean))].sort();
        const currentCategory = eventCategory.value;
        eventCategory.replaceChildren(new Option('All categories', ''));
        categories.forEach((category) => eventCategory.add(new Option(category, category)));
        eventCategory.value = categories.includes(currentCategory) ? currentCategory : '';
        renderEvents();
      } catch (error) {
        eventListStatus.textContent = error.message || 'Unable to load available streams.';
      }
    }

    function openEventList() {
      eventList.hidden = false;
      closeEvents.focus();
      loadEvents();
      if (!eventRefreshTimer) eventRefreshTimer = window.setInterval(loadEvents, 60_000);
    }

    function closeEventList() {
      eventList.hidden = true;
      if (eventRefreshTimer) {
        window.clearInterval(eventRefreshTimer);
        eventRefreshTimer = undefined;
      }
    }

    showEvents.addEventListener('click', openEventList);
    closeEvents.addEventListener('click', closeEventList);
    eventCategory.addEventListener('change', renderEvents);

    function dismissStreamPicker() {
      document.body.classList.remove('choosing-stream');
      player.focus();
    }

    function chooseStream() {
      document.body.classList.add('choosing-stream');
      input.focus();
      input.select();
    }

    function enterFullscreen() {
      const videoElement = player.el().querySelector('video');
      if (videoElement?.webkitEnterFullscreen) {
        videoElement.webkitEnterFullscreen();
      } else if (player.requestFullscreen) {
        player.requestFullscreen();
      } else if (player.el().requestFullscreen) {
        player.el().requestFullscreen();
      }
    }

    cancelChange.addEventListener('click', dismissStreamPicker);
    mobileEvents.addEventListener('click', openEventList);
    mobileChangeStream.addEventListener('click', chooseStream);
    mobileFullscreen.addEventListener('click', enterFullscreen);
    document.addEventListener('keydown', (event) => {
      if (event.key !== 'Escape') return;
      if (!eventList.hidden) closeEventList();
      else if (document.body.classList.contains('choosing-stream')) dismissStreamPicker();
    });

    player.on('playing', () => {
      status.textContent = '';
      streamLoading.hidden = true;
    });
    player.on('error', () => {
      streamLoading.hidden = true;
      const error = player.error();
      status.textContent = error ? `Playback error: ${error.message}` : 'Playback failed.';
    });
  </script>
</body>
</html>
